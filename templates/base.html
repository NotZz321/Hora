<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060708">
  <meta name="description" content="สำรวจแนวอาชีพผ่านดวงชาตา ผูกดวงด้วยโหราศาสตร์ไทยจากวัน เวลา และจังหวัดเกิด">
  <title>{% block title %}โหราอาชีพ — ดวงดาวกับทางของคุณ{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
  <script src="{{ url_for('static', filename='sky.js', v=asset_version) }}" defer></script>
</head>
<body{% if r is defined %} data-deity="{{ r.main.planet }}"{% endif %}>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}" aria-label="โหราอาชีพ หน้าหลัก">
      <span class="brand-mark" aria-hidden="true">✧</span>
      <span>โหราอาชีพ<span class="brand-caption">H O R A&nbsp;&nbsp;&nbsp;A R C H E E P</span></span>
    </a>
    <nav class="topnav" aria-label="เมนูหลัก">
      <a href="{{ url_for('index') }}#birth-form">ผูกดวง</a>
      <a href="{{ url_for('dashboard') }}"{% if request.endpoint == 'dashboard' %} aria-current="page"{% endif %}>สถิติ</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="alert" role="alert">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a class="footer-brand" href="{{ url_for('index') }}">✧ โหราอาชีพ</a>
    <p>ดวงดาวเป็นจุดเริ่มต้น ส่วนเส้นทางเป็นของคุณ</p>
    <small>โหราศาสตร์ไทย · คัมภีร์สุริยยาตร์</small>
  </footer>
  <script>
    (function () {
      var bar = document.querySelector('.topbar');
      function update() { bar.classList.toggle('scrolled', window.scrollY > 8); }
      update();
      window.addEventListener('scroll', update, { passive: true });
    })();
  </script>
</body>
</html>
