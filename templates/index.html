{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <h1>ผูกดวงชาตา ทำนายกรอบอาชีพ</h1>
  <p>กรอกวัน เวลา และจังหวัดเกิด ระบบจะคำนวณตำแหน่งดาวด้วยคัมภีร์สุริยยาตร์
     หาลัคนา ตนุลัคน์ ตนุเศษ แล้วดูภพกัมมะเพื่อบอกแนวอาชีพ</p>
</section>

<form class="card form" method="post" action="{{ url_for('predict') }}">
  <div class="field">
    <label for="nickname">ชื่อเล่น <span class="opt">(ไม่บังคับ)</span></label>
    <input id="nickname" name="nickname" maxlength="40" value="{{ form.get('nickname', '') }}" placeholder="เช่น ต้น">
  </div>

  <div class="field">
    <label>วันเกิด</label>
    <div class="row3">
      <select name="day" aria-label="วัน">
        {% for d in range(1, 32) %}
          <option value="{{ d }}" {{ 'selected' if form.get('day')|string == d|string }}>{{ d }}</option>
        {% endfor %}
      </select>
      <select name="month" aria-label="เดือน">
        {% for m in months %}
          <option value="{{ loop.index }}" {{ 'selected' if form.get('month')|string == loop.index|string }}>{{ m }}</option>
        {% endfor %}
      </select>
      <input name="year_be" type="number" min="2400" max="2600" required
             value="{{ form.get('year_be', '') }}" placeholder="ปี พ.ศ. เช่น 2545" aria-label="ปี พ.ศ.">
    </div>
  </div>

  <div class="field">
    <label>เวลาเกิด <span class="opt">(24 ชั่วโมง)</span></label>
    <div class="row2">
      <select name="hh" aria-label="ชั่วโมง">
        {% for h in range(24) %}
          <option value="{{ h }}" {{ 'selected' if form.get('hh')|string == h|string }}>{{ '%02d'|format(h) }} น.</option>
        {% endfor %}
      </select>
      <select name="mm" aria-label="นาที">
        {% for m in range(60) %}
          <option value="{{ m }}" {{ 'selected' if form.get('mm')|string == m|string }}>{{ '%02d'|format(m) }} นาที</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="field">
    <label for="province">จังหวัดที่เกิด</label>
    <select id="province" name="province">
      {% for p in provinces %}
        <option value="{{ p }}" {{ 'selected' if form.get('province', 'กรุงเทพมหานคร') == p }}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="actual">สายงาน/สาขาที่เรียนจริง <span class="opt">(ไม่บังคับ · ใช้เทียบกับคำทำนายตอนวิเคราะห์สถิติ)</span></label>
    <select id="actual" name="actual">
      <option value="">— ไม่ระบุ —</option>
      {% for a in actual_choices %}
        <option value="{{ a }}" {{ 'selected' if form.get('actual') == a }}>{{ a }}</option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="btn">ผูกดวงและบันทึก</button>
</form>
{% endblock %}
